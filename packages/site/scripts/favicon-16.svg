<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16">
  <!-- scripts/icon.svg redrawn on the pixel grid for the 16px favicon,
       with the frets faded so the dots stand out this small. -->
  <rect width="16" height="16" rx="3.5" fill="#f97316" stroke="none"/>
  <g fill="#ffffff" stroke="none">
    <rect x="3" y="3" width="10" height="2"/>
    <rect x="3" y="4" width="1" height="10"/>
    <rect x="6" y="4" width="1" height="10"/>
    <rect x="9" y="4" width="1" height="10"/>
    <rect x="12" y="4" width="1" height="10"/>
    <rect x="3" y="7" width="10" height="1" fill-opacity="0.5"/>
    <rect x="3" y="10" width="10" height="1" fill-opacity="0.5"/>
    <rect x="5" y="8" width="3" height="2"/>
    <rect x="8" y="11" width="3" height="2"/>
    <rect x="11" y="8" width="3" height="2"/>
  </g>
</svg>
