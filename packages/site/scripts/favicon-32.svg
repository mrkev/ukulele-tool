<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <!-- scripts/icon.svg redrawn on the pixel grid for the 32px favicon,
       with the frets faded so the dots stand out this small. -->
  <rect width="32" height="32" rx="7" fill="#f97316" stroke="none"/>
  <g fill="#ffffff" stroke="none">
    <rect x="7" y="6" width="18" height="3"/>
    <rect x="7" y="8" width="2" height="18"/>
    <rect x="12" y="8" width="2" height="18"/>
    <rect x="18" y="8" width="2" height="18"/>
    <rect x="23" y="8" width="2" height="18"/>
    <rect x="7" y="14" width="18" height="1" fill-opacity="0.55"/>
    <rect x="7" y="20" width="18" height="1" fill-opacity="0.55"/>
    <circle cx="13" cy="17" r="2.75"/>
    <circle cx="19" cy="23" r="2.75"/>
    <circle cx="24" cy="17" r="2.75"/>
  </g>
</svg>
